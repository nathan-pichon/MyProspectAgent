[project]
name = "myprospectagent"
version = "0.1.0a0"
description = "MyProspectAgent — agent de prospection freelance open-source, local-first. Trouve des clients potentiels avec ton propre LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "MyProspectAgent contributors" }]
keywords = ["prospecting", "lead-generation", "local-first", "llm", "ollama", "agent", "freelance"]

dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
# Scraping stack — optionnel pour que `validate`/`doctor` tournent sans navigateur.
scrape = [
  "ddgs>=6.1.7",
  "playwright>=1.42.0",
  "playwright-stealth>=1.0.6",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
mpa = "prospect.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prospect"]

[tool.hatch.build.targets.wheel.force-include]
"prospect/prompts" = "prospect/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
